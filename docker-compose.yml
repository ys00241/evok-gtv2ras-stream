services:
  # ──────────────────────────────────────────────
  # Backend: Stream Manager + Recording + Web UI
  # Serves EVERYTHING directly on port 6489 (internal)
  # Mapped to 8964 (external — no conflict)
  # ──────────────────────────────────────────────
  backend:
    image: ghcr.io/ys00241/evok-gtv2ras-stream:latest
    pull_policy: always
    ports:
      - "8964:6489"
    devices:
      - /dev/video0:/dev/video0
      - /dev/snd:/dev/snd
    volumes:
      - /tmp/hls:/hls
      - ./recordings:/recordings
    group_add:
      - audio
      - video
    environment:
      - STREAM_DIR=/hls
      - RECORD_DIR=/recordings
      - FLASK_ENV=production
      - HW_ENCODER=libx264
      - PORT=6489
      - AUDIO_DEV=hw:3,0
      # Low-latency tuning (can be read by app.py to override defaults)
      - HLS_TIME=0.5
      - HLS_LIST_SIZE=3
      - THREAD_QUEUE_VIDEO=2048
      - THREAD_QUEUE_AUDIO=1024
      - ENCODER_PRESET=ultrafast
      - ENCODER_TUNE=zerolatency
      - GOP_SIZE=30
      - BF_FRAMES=0
    command: ["python", "app.py"]
    restart: unless-stopped
    stop_grace_period: 10s

  # ──────────────────────────────────────────────
  # Chromecast ADB Remote (merged into backend)
  # ──────────────────────────────────────────────
  cc-remote:
    image: ghcr.io/ys00241/evok-gtv2ras-stream:latest
    network_mode: host
    environment:
      - CC_HOST=192.168.0.???
      - ADB_PORT=5555
    command: ["python", "cc_remote.py"]
    restart: unless-stopped
    profiles:
      - donotstart
